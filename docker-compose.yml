services:
  liuyao-core:
    container_name: liuyao_system
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # 挂载前端静态目录，便于修改前端免重新编译
      - ./frontend:/app/frontend
      # 挂载后端核心业务逻辑
      - ./backend/app:/app/backend/app
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
